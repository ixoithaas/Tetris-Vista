name: Deploy to GitHub Pages

# The repo is a Vite app: index.html at the root loads /src/main.tsx (raw
# TypeScript + JSX), which a browser cannot execute. Pages must therefore publish
# the *built* output in dist/, not the repository source.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; do not cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The site was originally created as a "deploy from a branch" (legacy) site, which
      # publishes the repo source and overwrites any Actions deployment. Flip it to
      # GitHub Actions as the source. Idempotent: a no-op once the source is workflow,
      # and it self-heals if the setting is ever switched back. GITHUB_TOKEN can do this
      # because the workflow declares `pages: write` above.
      - name: Use GitHub Actions as the Pages source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          build_type=$(gh api repos/{owner}/{repo}/pages --jq .build_type || echo unknown)
          echo "Current Pages build_type: $build_type"
          if [ "$build_type" != "workflow" ]; then
            gh api -X PUT repos/{owner}/{repo}/pages -f build_type=workflow
            echo "Switched Pages source to GitHub Actions."
          else
            echo "Already using GitHub Actions; nothing to do."
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Reads the Pages config and exports base_path: '/Tetris-Vista' for a project
      # page, '' for a user/org page.
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
