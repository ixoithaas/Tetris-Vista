name: Deploy to GitHub Pages

# The repo is a Vite app: index.html at the root loads /src/main.tsx (raw
# TypeScript + JSX), which a browser cannot execute. Pages must therefore publish
# the *built* output in dist/, not the repository source.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; do not cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # NOTE: the Pages *source* setting ("Deploy from a branch" vs "GitHub Actions")
      # cannot be changed by this workflow. PUT /repos/{owner}/{repo}/pages returns 403
      # for this repo's token even though `pages: write` is declared above - the setting
      # needs repo admin. Switching it is a one-time manual step in Settings -> Pages.
      # The `deploy` job below works around the leftover legacy source; see the comment
      # there before changing this workflow.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Reads the Pages config and exports base_path: '/Tetris-Vista' for a project
      # page, '' for a user/org page.
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Why this step exists: the Pages source is "Deploy from a branch" (main), so every
      # push to main triggers *two* publishers - this Actions deployment, and a legacy
      # build that publishes the raw repo source (root index.html loading /src/main.tsx,
      # which a browser cannot execute). Whichever publishes last wins, and when the
      # legacy build won the site went blank. That is what the user saw.
      #
      # So: wait until the legacy build for *this* commit has settled, then deploy, so
      # this deployment is the last writer. Note it also waits correctly when the legacy
      # build has not even started yet (latest still points at the previous commit), and
      # it exits immediately once the source reads "workflow".
      #
      # Switching the source to GitHub Actions in Settings -> Pages makes this a no-op
      # and removes the race permanently; it cannot be done from here (403, see above).
      # Residual risk: a legacy rebuild starting more than ~4 min after this job would
      # still overwrite us. That only happens if the source stays legacy *and* Actions
      # queueing is pathologically slow.
      - name: Wait for the legacy branch build to settle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          build_type=$(gh api "repos/$REPO/pages" --jq .build_type)
          if [ "$build_type" = "workflow" ]; then
            echo "Pages source is GitHub Actions; nothing to wait for."
            exit 0
          fi
          echo "Pages source is still a branch; waiting for its build of $GITHUB_SHA."
          for i in $(seq 1 24); do
            line=$(gh api "repos/$REPO/pages/builds/latest" --jq '.commit + " " + .status')
            echo "attempt $i: $line"
            case "$line" in
              "$GITHUB_SHA building") ;;
              "$GITHUB_SHA "*) echo "Legacy build for this commit has settled."; exit 0 ;;
            esac
            sleep 10
          done
          echo "::warning::Timed out waiting for the legacy Pages build; deploying anyway."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
