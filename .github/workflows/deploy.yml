name: Deploy to GitHub Pages

# The repo is a Vite app: index.html at the root loads /src/main.tsx (raw
# TypeScript + JSX), which a browser cannot execute. Pages must therefore publish
# the *built* output in dist/, not the repository source.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; do not cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The site was originally created as a "deploy from a branch" (legacy) site, which
      # publishes the repo source and overwrites any Actions deployment. Flip it to
      # GitHub Actions as the source. Idempotent: a no-op once the source is workflow,
      # and it self-heals if the setting is ever switched back. GITHUB_TOKEN can do this
      # because the workflow declares `pages: write` above.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Reads the Pages config and exports base_path: '/Tetris-Vista' for a project
      # page, '' for a user/org page.
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The Pages source is still "deploy from a branch" (main), so every push also
      # triggers the legacy branch build, which republishes the raw repo source and
      # lands ~40s after this deployment - that is what kept the page blank. The source
      # cannot be changed from here: PUT /repos/{owner}/{repo}/pages returns 403 for both
      # an org token and this workflow's GITHUB_TOKEN (needs "Pages: write" on a
      # fine-grained token / repo admin). Until the source is switched to GitHub Actions
      # in Settings -> Pages, wait for the legacy build of this same commit to settle so
      # this deployment is the last one to publish. Self-disabling: it exits immediately
      # once the source reads "workflow", and it only ever issues GETs.
      - name: Wait for the legacy branch build to settle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          build_type=$(gh api "repos/$REPO/pages" --jq .build_type)
          if [ "$build_type" = "workflow" ]; then
            echo "Pages source is GitHub Actions; nothing to wait for."
            exit 0
          fi
          echo "Pages source is still a branch; waiting for its build of $GITHUB_SHA."
          for i in $(seq 1 24); do
            line=$(gh api "repos/$REPO/pages/builds/latest" --jq '.commit + " " + .status')
            echo "attempt $i: $line"
            case "$line" in
              "$GITHUB_SHA building") ;;
              "$GITHUB_SHA "*) echo "Legacy build for this commit has settled."; exit 0 ;;
            esac
            sleep 10
          done
          echo "::warning::Timed out waiting for the legacy Pages build; deploying anyway."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
